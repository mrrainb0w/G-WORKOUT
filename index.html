<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佳练 G-WORKOUT</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#1d1d1f; --sub:#6b7280;
    --brand:#0a84ff; --line:#e5e7eb; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75; -webkit-font-smoothing:antialiased;
    padding:48px 16px 64px;
  }
  .wrap{max-width:680px;margin:0 auto;text-align:center}
  .badge{width:120px;height:120px;border-radius:27px;margin:0 auto 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.15)}
  h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
  h1 span{color:var(--brand);font-size:22px;font-weight:600;margin-left:8px}
  .tag{color:var(--sub);font-size:15px;margin:10px 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:left}
  .card h2{font-size:17px;margin-bottom:8px}
  .card p{font-size:14px;color:#374151}
  a.btn{display:inline-block;background:var(--brand);color:#fff;font-size:15px;font-weight:600;
    padding:10px 26px;border-radius:24px;margin:0 8px;text-decoration:none}
  footer{color:var(--sub);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <img class="badge" src="icon.png" alt="佳练图标">
  <h1>佳练<span>G-WORKOUT</span></h1>
  <div class="tag">拍照识别训练课表 · 一键同步到你的 Garmin 账号</div>

  <div class="card">
    <h2>它做什么</h2>
    <p>给训练课表拍张照，圈出要导入的内容，G-WORKOUT 会自动识别出间歇跑、节奏跑、长距离慢跑等结构化课程，命名后一键同步到你本人的 Garmin 账号——训练库直接多出一门可执行的课，还能排进训练日历，手表自动更新。</p>
  </div>

  <div class="card">
    <h2>隐私优先</h2>
    <p>课表识别与 AI 命名全部在设备本地完成，图片不离开手机；不收集、不追踪、不上传任何数据；Garmin 密码仅在登录瞬间使用、永不保存。</p>
  </div>

  <div style="margin-top:8px">
    <a class="btn" href="support.html">技术支持</a>
    <a class="btn" href="privacy.html">隐私政策</a>
  </div>

  <footer>© 2026 Xudong Han</footer>
</div>
</body>
</html>
